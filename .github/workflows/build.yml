name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ShaderToyFX.dll, build/Release/ShaderToyFX_Source.dll, README.md, bookmarklet.txt, "Installer le bouton ShaderToyFX.html", LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ShaderToyFX-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShaderToyFX-win64
          path: ShaderToyFX-win64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ShaderToyFX-win64.zip
          generate_release_notes: true
