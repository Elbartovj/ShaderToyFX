name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/ShaderLoader.dll, build/Release/ShaderLoader_Source.dll, README.md, bookmarklet.txt, bookmarklet-universel.txt, "Installer le favori Shader Loader.html", LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ShaderLoader-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ShaderLoader-win64
          path: ShaderLoader-win64.zip

      - name: Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ShaderLoader-win64.zip
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
